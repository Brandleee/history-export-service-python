# Load-Balancer vor den History-Instanzen.
#
# "history" loest ueber den Docker-DNS auf ALLE laufenden Instanzen auf; nginx
# verteilt Round-Robin darauf. Durch die Variable + resolver (valid=5s) wird
# der Name laufend neu aufgeloest - neu hochskalierte oder gestoppte
# Instanzen werden also ohne Neustart von nginx beruecksichtigt.
server {
    listen 80;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $history_upstream http://history:8091;

    location / {
        proxy_pass $history_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts + Retry auf eine andere Instanz, wenn eine nicht antwortet
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
    }
}
